table_fields:
  re_sup_cat:
    sheet: "Tickets ADUS Tickets crea... 1"
    start_row: 2 

    columns:
      - name: "re_cat"             
        col: "Support Category"

    aggregate: true                
    aggregation_type: "count"      
    group_by: "re_cat"             
    count_column: "re_cat_count"   
    uncategorized_label: "Uncategorized" 

    format_values: true
    value_format:
      type: "number"
      decimals: 0

  su_sup_cat:
    sheet: "Tickets ADUS Tickets crea... 2"
    start_row: 2 

    columns:
      - name: "su_cat"             
        col: "Support Category"

    aggregate: true                
    aggregation_type: "count"      
    group_by: "su_cat"             
    count_column: "su_cat_count"   
    uncategorized_label: "Uncategorized" 

    format_values: true
    value_format:
      type: "number"
      decimals: 0

  top_orgs:
    sheet: "Tickets ADUS Tickets crea... 2"
    start_row: 2 

    columns:
      - name: "org_name"           
        col: "Ticket organisation name"

    aggregate: true                
    aggregation_type: "count"      
    group_by: "org_name"           
    count_column: "org_count"      
    limit: 5                       

    format_values: true
    value_format:
      type: "number"
      decimals: 0